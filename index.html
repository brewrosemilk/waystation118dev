<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waystation Archive (Emergency Standby)</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent-color: #990000;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        .btn-alt {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
        }

        .filter-panel, .form-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type="text"], select, textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 250px;
            resize: vertical;
        }

        .fic-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .fic-title {
            color: #fff;
            margin: 0 0 5px 0;
            cursor: pointer;
        }

        .fic-title:hover {
            color: #ff4d4d;
        }

        .fic-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .tag-pill {
            display: inline-block;
            background: #222;
            border: 1px solid #444;
            color: #ccc;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 5px;
            margin-top: 5px;
        }

        .fic-body {
            white-space: pre-line;
            background: #090909;
            padding: 25px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 1.05rem;
            margin: 20px 0;
        }

        .likes-counter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #ff4d4d;
        }

        .comment-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .comment-box {
            background-color: #111;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .comment-reply {
            margin-left: 20px;
            border-left: 2px solid var(--accent-color);
            padding-left: 12px;
            margin-top: 10px;
            background: #181818;
            border-radius: 0 4px 4px 0;
            padding: 8px 12px;
        }

        .reply-banner {
            background: #222;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reply-banner button {
            padding: 2px 6px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Waystation Archive</h1>
        <span class="badge">Emergency Standby</span>
    </header>

    <div class="nav-buttons">
        <button onclick="showView('listView')">Browse Works</button>
        <button onclick="showView('formView')" class="btn-alt">+ Post a Work</button>
    </div>

    <!-- BROWSE & FILTER VIEW -->
    <div id="listView">
        <div class="filter-panel" id="filterConsole">
            <strong>Filter by Tag:</strong>
            <div class="checkbox-group" style="margin-top: 12px;">
                <label><input type="checkbox" class="searchTag" value="Canon Compliant" onchange="filterFics()"> Canon Compliant</label>
                <label><input type="checkbox" class="searchTag" value="Canon Divergent" onchange="filterFics()"> Canon Divergent</label>
                <label><input type="checkbox" class="searchTag" value="Alternate Universe" onchange="filterFics()"> Alternate Universe</label>
                <label><input type="checkbox" class="searchTag" value="Getting Together" onchange="filterFics()"> Getting Together</label>
                <label><input type="checkbox" class="searchTag" value="Love Realizations & Confessions" onchange="filterFics()"> Love Realizations & Confessions</label>
                <label><input type="checkbox" class="searchTag" value="Platonic & Familial Love" onchange="filterFics()"> Platonic & Familial Love</label>
                <label><input type="checkbox" class="searchTag" value="Porn With Feelings" onchange="filterFics()"> Porn With Feelings</label>
                <label><input type="checkbox" class="searchTag" value="Freak4Freak" onchange="filterFics()"> Freak4Freak</label>
                <label><input type="checkbox" class="searchTag" value="Omegaverse" onchange="filterFics()"> Omegaverse</label>
                <label><input type="checkbox" class="searchTag" value="Violence" onchange="filterFics()"> Violence</label>
                <label><input type="checkbox" class="searchTag" value="Main Character Death" onchange="filterFics()"> Main Character Death</label>
            </div>
        </div>

        <div id="ficsContainer">Loading emergency archive works...</div>
    </div>

    <!-- SINGLE WORK VIEW -->
    <div id="singleView" style="display: none;">
        <button onclick="showView('listView')" style="margin-bottom: 15px;">← Back to Works</button>
        <div id="singleFicContent"></div>
    </div>

    <!-- PUBLISHING FORM VIEW -->
    <div id="formView" style="display: none;">
        <div class="form-panel">
            <h2>Post Work to Emergency Archive</h2>
            <form id="postForm" onsubmit="handlePostSubmit(event)">
                <label>Title:</label>
                <input type="text" id="postTitle" required>

                <label>Author Name / Pseud:</label>
                <input type="text" id="postAuthor" required>

                <label>Pairing / Characters:</label>
                <input type="text" id="postPairing" placeholder="e.g., Character A/Character B">

                <label>Rating:</label>
                <select id="postRating">
                    <option value="General Audiences">General Audiences</option>
                    <option value="Teen And Up Audiences">Teen And Up Audiences</option>
                    <option value="Mature">Mature</option>
                    <option value="Explicit">Explicit</option>
                </select>

                <label style="margin-top: 10px;">Tags:</label>
                <div class="checkbox-group" style="margin-bottom: 20px;">
                    <label><input type="checkbox" class="formTag" value="Canon Compliant"> Canon Compliant</label>
                    <label><input type="checkbox" class="formTag" value="Canon Divergent"> Canon Divergent</label>
                    <label><input type="checkbox" class="formTag" value="Alternate Universe"> Alternate Universe</label>
                    <label><input type="checkbox" class="formTag" value="Getting Together"> Getting Together</label>
                    <label><input type="checkbox" class="formTag" value="Love Realizations & Confessions"> Love Realizations & Confessions</label>
                    <label><input type="checkbox" class="formTag" value="Platonic & Familial Love"> Platonic & Familial Love</label>
                    <label><input type="checkbox" class="formTag" value="Porn With Feelings"> Porn With Feelings</label>
                    <label><input type="checkbox" class="formTag" value="Freak4Freak"> Freak4Freak</label>
                    <label><input type="checkbox" class="formTag" value="Omegaverse"> Omegaverse</label>
                    <label><input type="checkbox" class="formTag" value="Violence"> Violence</label>
                    <label><input type="checkbox" class="formTag" value="Main Character Death"> Main Character Death</label>
                </div>

                <label>Story Text / Body:</label>
                <textarea id="postBody" required></textarea>

                <button type="submit" id="submitBtn">Publish to Archive</button>
            </form>
        </div>
    </div>
</div>

<script>
    // YOUR TEST GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzmfdowplJV8kuycFa5L7tKrneDf5nT_DkPTdrDF8AFlZJJ2uSQ2o5Q06dhcMt6x8YyvQ/exec";

    let allFics = [];
    let activeFic = null;
    let currentReplyParentId = "";

    // INITIAL LOAD
    document.addEventListener("DOMContentLoaded", fetchFics);

    function fetchFics() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                allFics = data;
                renderFicsList(allFics);
            })
            .catch(err => {
                document.getElementById("ficsContainer").innerHTML = "<p>Error loading archive. Please refresh.</p>";
                console.error(err);
            });
    }

    function showView(viewId) {
        document.getElementById("listView").style.display = viewId === "listView" ? "block" : "none";
        document.getElementById("singleView").style.display = viewId === "singleView" ? "block" : "none";
        document.getElementById("formView").style.display = viewId === "formView" ? "block" : "none";
        window.scrollTo(0, 0);
    }

    function renderFicsList(ficsToRender) {
        const container = document.getElementById("ficsContainer");
        if (ficsToRender.length === 0) {
            container.innerHTML = "<p>No works found matching your filter criteria.</p>";
            return;
        }

        container.innerHTML = ficsToRender.map((fic, index) => {
            const tagArray = fic.tags ? fic.tags.split(", ") : [];
            const tagBadges = tagArray.map(t => `<span class="tag-pill">${t}</span>`).join(" ");
            const likesCount = fic.likesCount || 0;

            return `
                <div class="fic-card">
                    <h2 class="fic-title" onclick="openFic(${index})">${fic.title}</h2>
                    <div class="fic-meta">
                        By <strong>${fic.author}</strong> | Pairing: ${fic.pairing || 'N/A'} | Rating: <strong>${fic.rating}</strong> | ❤️ ${likesCount} Kudos
                    </div>
                    <div>${tagBadges}</div>
                </div>
            `;
        }).join("");
    }

    function filterFics() {
        const checkedTags = Array.from(document.querySelectorAll(".searchTag:checked")).map(cb => cb.value);

        if (checkedTags.length === 0) {
            renderFicsList(allFics);
            return;
        }

        const filtered = allFics.filter(fic => {
            const ficTags = fic.tags ? fic.tags.split(", ") : [];
            return checkedTags.every(tag => ficTags.includes(tag));
        });

        renderFicsList(filtered);
    }

    function openFic(index) {
        activeFic = allFics[index];
        currentReplyParentId = ""; // Reset reply target
        const tagArray = activeFic.tags ? activeFic.tags.split(", ") : [];
        const tagBadges = tagArray.map(t => `<span class="tag-pill">${t}</span>`).join(" ");
        const likesCount = activeFic.likesCount || 0;

        const container = document.getElementById("singleFicContent");
        container.innerHTML = `
            <h2>${activeFic.title}</h2>
            <div class="fic-meta">
                By <strong>${activeFic.author}</strong> | Pairing: ${activeFic.pairing || 'N/A'} | Rating: <strong>${activeFic.rating}</strong>
            </div>
            <div style="margin-bottom: 15px;">${tagBadges}</div>

            <div style="margin-bottom: 20px;">
                <button id="likeBtn" onclick="handleLike('${activeFic.title}')">❤️ Leave Kudos (${likesCount})</button>
            </div>

            <div class="fic-body">${activeFic.body}</div>

            <div class="comment-section">
                <h3>Comments</h3>
                <div id="commentsContainer">${renderComments(activeFic)}</div>

                <div class="form-panel" style="margin-top: 20px;">
                    <h4 id="commentFormHeader">Leave a Comment</h4>
                    <div id="replyBannerContainer"></div>
                    <input type="text" id="commentNameInput" placeholder="Name / Pseud (Optional)">
                    <textarea id="commentTextInput" style="height: 100px;" placeholder="Write a comment..." required></textarea>
                    <button onclick="handleCommentSubmit()">Post Comment</button>
                </div>
            </div>
        `;

        showView("singleView");
    }

    function renderComments(fic) {
        if (!fic.comments || fic.comments.length === 0) {
            return "<p style='color: #888;'>No comments yet. Be the first!</p>";
        }

        // Separate top-level comments (no parentId) from replies
        const topLevel = fic.comments.filter(c => !c.parentId);

        return topLevel.map(c => {
            // Find replies matching this top-level comment ID
            const replies = fic.comments.filter(r => String(r.parentId) === String(c.id));
            
            const repliesHtml = replies.map(r => `
                <div class="comment-reply">
                    <strong>${r.name}:</strong> ${r.text}
                </div>
            `).join('');

            return `
                <div class="comment-box">
                    <strong>${c.name}:</strong> ${c.text}
                    <button class="btn-alt" style="padding: 2px 8px; font-size: 0.75rem; margin-left: 10px;" onclick="setReplyTarget('${c.id}', '${c.name}')">Reply</button>
                    ${repliesHtml}
                </div>
            `;
        }).join('');
    }

    function setReplyTarget(commentId, authorName) {
        currentReplyParentId = commentId;
        const bannerContainer = document.getElementById("replyBannerContainer");
        if (bannerContainer) {
            bannerContainer.innerHTML = `
                <div class="reply-banner">
                    <span>Replying to <strong>${authorName}</strong></span>
                    <button onclick="cancelReply()">Cancel Reply</button>
                </div>
            `;
        }
        document.getElementById("commentTextInput").focus();
    }

    function cancelReply() {
        currentReplyParentId = "";
        const bannerContainer = document.getElementById("replyBannerContainer");
        if (bannerContainer) bannerContainer.innerHTML = "";
    }

    function handleLike(ficTitle) {
        const btn = document.getElementById("likeBtn");
        btn.disabled = true;

        // Optimistic UI update
        activeFic.likesCount = (activeFic.likesCount || 0) + 1;
        btn.innerHTML = `❤️ Kudos Left! (${activeFic.likesCount})`;

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                type: "likes",
                ficTitle: ficTitle
            })
        }).catch(err => console.error("Error logging like:", err));
    }

    function handleCommentSubmit() {
        const nameInput = document.getElementById("commentNameInput");
        const textInput = document.getElementById("commentTextInput");

        if (!textInput.value.trim()) return;

        const newComment = {
            name: nameInput.value.trim() || "Anonymous",
            text: textInput.value.trim(),
            parentId: currentReplyParentId
        };

        // Append to local state immediately
        if (!activeFic.comments) activeFic.comments = [];
        activeFic.comments.push({
            id: "c_" + activeFic.comments.length,
            ...newComment
        });

        // Re-render comments container & clear form
        document.getElementById("commentsContainer").innerHTML = renderComments(activeFic);
        textInput.value = "";
        cancelReply();

        // Send to Apps Script in background
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                type: "comments",
                ficTitle: activeFic.title,
                name: newComment.name,
                comment: newComment.text,
                parentId: newComment.parentId
            })
        }).catch(err => console.error("Error submitting comment:", err));
    }

    function handlePostSubmit(e) {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Publishing...";

        const selectedTags = Array.from(document.querySelectorAll(".formTag:checked")).map(cb => cb.value).join(", ");

        const payload = {
            type: "fics",
            title: document.getElementById("postTitle").value.trim(),
            author: document.getElementById("postAuthor").value.trim(),
            pairing: document.getElementById("postPairing").value.trim(),
            rating: document.getElementById("postRating").value,
            tags: selectedTags,
            body: document.getElementById("postBody").value.trim()
        };

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            alert("Work published successfully!");
            document.getElementById("postForm").reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "Publish to Archive";
            fetchFics(); // Reload works list
            showView("listView");
        })
        .catch(err => {
            alert("Error publishing work. Please check your connection.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Publish to Archive";
            console.error(err);
        });
    }
</script>

</body>
</html>
